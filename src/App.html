function renderFiltros() {

      '<span class="n">' + n + '</span></span><small>' + f.t + '</small></button>';

}
function filtrados() {

  let arr = termos.length ? S.items[S.aba].filter(it => casaBusca(it._h, termos)) : S.items[S.aba].slice();
  S.buscaAprox = false;
  if (!arr.length && termos.length === 2) { // nada com as duas palavras: mostra o que tem pelo menos uma
    arr = S.items[S.aba].filter(it => acertos(it._h, termos) >= 1); S.buscaAprox = arr.length > 0;
  }
  const f = FILTROS.find(x => x.id === S.filtro);
  if (f && f.teste) arr = arr.filter(f.teste);
  if (S.filtro === 'recentes') arr = arr.sort((a, b) => String(b.dataAq).localeCompare(String(a.dataAq)));
  return arr;
}

    (S.buscaAprox ? ' · nenhuma com todas as palavras, mostrando as parecidas' : '') +

function listaFotos(it) {
  const fotos = fotosMarco(it).map(id => ({ tipo: 'marco', id: id, src: driveThumb(id, 1200), legenda: 'Foto da coleção' }));
  const ref = S.refCache[it.id];
  const esc0 = refInfo(it.fotoRef);
  if (ref && ref.fotos && ref.fotos.length) ref.fotos.forEach(f => fotos.push(Object.assign({ tipo: 'ref' }, f,
    { src: f.drive ? bancoUrl(f.drive, 1000) : (esc0.id && f.url === esc0.url ? bancoUrl(esc0.id, 1000) : f.url), orig: f.url })));
  if (temFotoRef(it) && !fotos.some(f => f.tipo === 'ref' && f.url === esc0.url)) fotos.push({ tipo: 'ref', src: refSrc(it.fotoRef, 1000), orig: esc0.url, url: esc0.url, legenda: '', fonte: 'Referência salva' });
  // a foto de referência escolhida vem antes das demais de referência
  const iRef = fotos.findIndex(f => f.tipo === 'ref' && f.url === esc0.url);
  const iPrim = fotos.findIndex(f => f.tipo === 'ref');
  if (iRef > iPrim && iPrim >= 0) fotos.splice(iPrim, 0, fotos.splice(iRef, 1)[0]);
  // a foto principal escolhida vem primeiro
  const ci = capaInfo(it);
  const iP = ci.k === 'ref' ? fotos.findIndex(f => f.tipo === 'ref' && f.url === esc0.url) : fotos.findIndex(f => f.tipo === 'marco' && f.id === principalMarco(it));
  if (iP > 0) fotos.unshift(fotos.splice(iP, 1)[0]);
  return fotos;
}

function marcar(txt, palavras) {
  let h = esc(txt);
  (palavras || []).forEach(w => {
    const re = new RegExp('(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    h = h.replace(re, '<mark>$1</mark>');
  });
  return h;
}

function carregarRef(it) {
  if (S.refCache[it.id]) return;
  apiJ('getReferenceJson', S.aba, { mack: it.mack, mack2: it.mack2, nome: it.nome, cor: it.cor, base: it.base, interior: it.interior,
    vidro: it.vidro, roda: it.roda, outros: it.outros, adesivo: it.adesivo }).then(ref => {
    S.refCache[it.id] = ref;
    const melhor = (ref.fotos || []).find(f => f.drive);
    if (!refInfo(it.fotoRef).id && melhor) {
      it.fotoRef = 'drive:' + melhor.drive + '|' + melhor.url;
      api('setFotoRef', S.aba, it.id, melhor.url, melhor.drive).then(v => { it.fotoRef = v; renderLista(); }).catch(() => {});
    }
    if (S.atual === it) renderDetalhe();
  }).catch(e => {
    S.refCache[it.id] = { fotos: [], avisos: ['Não foi possível ler a referência agora (' + e.message + ').'] };
    if (S.atual === it) renderDetalhe();
  });
}

/* ================================================================ BAMCA (comparativo de variações) */
S.bamca = {};
function chaveBamca(it) { const p = cm(it); return p ? S.aba + '|' + p.n + p.l : ''; }
function carregarBamca(it) {
  const k = chaveBamca(it);
  if (!k || S.bamca[k] !== undefined) return;
  S.bamca[k] = null;
  apiJ('getBamca', S.aba, cmTxt(it)).then(r => { S.bamca[k] = r; if (S.atual === it) renderDetalhe(); }).catch(() => { delete S.bamca[k]; });
}
/* quantos campos do cadastro batem com a variação do BAMCA (cor, rodas, base, vidros, interior) */
function notaBamca(it, v) {
  let n = 0, de = 0;
  [['cor', 'body'], ['roda', 'wheels'], ['base', 'base'], ['vidro', 'windows'], ['interior', 'interior']].forEach(([a, b]) => {
    const t = prepararBusca(it[a] || ''); if (!t.length || !v[b]) return;
    de++; if (casaBusca(norm(v[b] + ' ' + traduzir(v[b])), t)) n++;
  });
  return { n: n, de: de };
}
function secaoBamca(it, aba) {
  const r = S.bamca[chaveBamca(it)];
  if (r === null) return '<div class="secao"><h3>Variações no BAMCA</h3><div class="carregando">Carregando…</div></div>';
  if (!r || !r.ok) return '';
  const pc = cm(it), todas = r.v.map((v, i) => Object.assign({}, v, { i: i, sc: notaBamca(it, v) }));
  const melhor = Math.max.apply(null, todas.map(v => v.sc.n));
  const ordem = todas.slice().sort((a, b) => b.sc.n - a.sc.n || a.i - b.i);
  const ver = S.bamcaTudo === r.chave ? ordem : ordem.slice(0, 8);
  const pt = x => { const t = traduzir(x); return t || x; };
  return '<div class="secao"><h3>Variações no BAMCA · ' + esc(r.casting) + ' ' + esc(r.modelo) + ' (' + r.v.length + ')</h3>' +

    ver.map(v => {

      const parecida = melhor > 0 && v.sc.n === melhor;

      const det = [tem(v.wheels) && 'rodas ' + pt(v.wheels), tem(v.base) && 'base ' + pt(v.base), tem(v.windows) && 'vidros ' + pt(v.windows), tem(v.interior) && 'interior ' + pt(v.interior),
        tem(v.deco) && 'decoração ' + pt(v.deco), v.fab, v.data].filter(Boolean).join(' · ');
      return '<li class="' + (parecida || igual ? 'atual' : '') + '"><span class="vn">' + esc(v.var) + '</span><span class="vt"><b>' + esc(pt(v.body)) + '</b>' +
        (igual ? ' <small>mesmo número da sua variação Mack</small>' : '') + (parecida ? ' <small>parecida com a sua (' + v.sc.n + ' de ' + v.sc.de + ' itens)</small>' : '') +
        '<small>' + esc(det + (v.obs ? ' · ' + v.obs : '')) + '</small></span></li>';
    }).join('') + '</ul>' +
    (r.v.length > 8 ? '<div class="acoes"><button class="btn" data-acao="bamcaTudo" data-chave="' + esc(r.chave) + '">' + (S.bamcaTudo === r.chave ? 'Mostrar só as mais parecidas' : 'Ver todas as ' + r.v.length + ' variações') + '</button></div>' : '') +
    '<div class="foto-credito">Fonte: BAMCA (bamca.org), cópia de julho de 2026, uso privado autorizado por Dean Dierschow. Os números de variação do BAMCA são próprios e podem não coincidir com os do Charlie Mack.</div></div>';
}

/* ================================================================ fotos da coleção */
/* Encontra a miniatura na foto. O fundo é aprendido pelas bordas da imagem (até 5 tons, o que cobre mármore,
   toalha estampada e sombra); o objeto é o que foge desses tons. Devolve o retângulo ou null se não tiver certeza. */
function acharObjeto(img) {
  const W = 180, k = W / Math.max(img.width, img.height), w = Math.max(8, Math.round(img.width * k)), h = Math.max(8, Math.round(img.height * k));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d'); ctx.drawImage(img, 0, 0, w, h);
  const d = ctx.getImageData(0, 0, w, h).data, px = (x, y) => (y * w + x) * 4;
  const m = Math.max(2, Math.round(Math.min(w, h) * 0.06)), borda = [];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (x < m || y < m || x >= w - m || y >= h - m) { const i = px(x, y); borda.push([d[i], d[i + 1], d[i + 2]]); }
  // k-means simples (k=5) nas cores da borda
  let cent = [0, 1, 2, 3, 4].map(j => borda[Math.floor((j + 0.5) * borda.length / 5)].slice());
  const dist = (p, q) => Math.abs(p[0] - q[0]) + Math.abs(p[1] - q[1]) + Math.abs(p[2] - q[2]);
  let rot = new Array(borda.length).fill(0);
  for (let it = 0; it < 8; it++) {
    const soma = cent.map(() => [0, 0, 0, 0]);
    borda.forEach((p, i) => { let b = 0, bd = 1e9; cent.forEach((q, j) => { const dd = dist(p, q); if (dd < bd) { bd = dd; b = j; } }); rot[i] = b; const s = soma[b]; s[0] += p[0]; s[1] += p[1]; s[2] += p[2]; s[3]++; });
    cent = cent.map((q, j) => soma[j][3] ? [soma[j][0] / soma[j][3], soma[j][1] / soma[j][3], soma[j][2] / soma[j][3]] : q);
  }
  const cont = cent.map((q, j) => rot.filter(r => r === j).length);
  const fundo = cent.filter((q, j) => cont[j] >= borda.length * 0.08);
  const dmin = p => Math.min.apply(null, fundo.map(q => dist(p, q)));
  const dsB = borda.map(dmin).sort((a, b) => a - b);
  const lim = Math.max(30, dsB[Math.floor(dsB.length * 0.95)] * 1.4);
  const lin = new Array(h).fill(0), col = new Array(w).fill(0); let total = 0;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = px(x, y);
    if (dmin([d[i], d[i + 1], d[i + 2]]) > lim) { lin[y]++; col[x]++; total++; }
  }
  const corte = (arr, n) => { const t = Math.max(1, n * 0.06); let a = 0, b = arr.length - 1; while (a < b && arr[a] < t) a++; while (b > a && arr[b] < t) b--; return [a, b]; };
  const [y0, y1] = corte(lin, w), [x0, x1] = corte(col, h);
  const area = (x1 - x0 + 1) * (y1 - y0 + 1) / (w * h);
  acharObjeto.ultimo = { fundo: fundo, lim: lim };
  if (total < w * h * 0.01 || area < 0.02 || area > 0.9) return null;
  return { x: x0 / k, y: y0 / k, w: (x1 - x0 + 1) / k, h: (y1 - y0 + 1) / k };
}
function carregarImg(src) {
  return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('imagem não abriu')); im.src = src; });
}
/* Reduz a foto (lado maior = max) e, se pedir, centraliza a miniatura com uma margem, em formato 4:3 */
function reduzirImagem(file, max, centralizar) {
  const url = URL.createObjectURL(file);
  return carregarImg(url).then(img => {
    URL.revokeObjectURL(url);
    const r = regiao(img, centralizar ? 'auto' : 'inteira', 1, null);
    const kk = Math.min(1, max / Math.max(r.w, r.h));
    const c = document.createElement('canvas'); c.width = Math.round(r.w * kk); c.height = Math.round(r.h * kk);
    c.getContext('2d').drawImage(img, r.x, r.y, r.w, r.h, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.85);
  });
}
/* Retângulo 4:3 a recortar: automático (acha o carrinho), foto inteira, ou centro escolhido com o dedo; zoom > 1 aproxima */
function regiao(img, modo, zoom, centro) {
  const W = img.width, H = img.height;
  if (modo === 'inteira' && zoom <= 1 && !centro) return { x: 0, y: 0, w: W, h: H };
  let cw, ch, cx = W / 2, cy = H / 2;
  const obj = modo === 'auto' ? (() => { try { return acharObjeto(img); } catch (e) { return null; } })() : null;
  if (obj) { cw = obj.w * 1.36; ch = obj.h * 1.36; cx = obj.x + obj.w / 2; cy = obj.y + obj.h / 2; }
  else { cw = W; ch = H; }
  if (cw / ch > 4 / 3) ch = cw * 3 / 4; else cw = ch * 4 / 3;
  cw /= zoom; ch /= zoom;
  if (cw > W) { ch *= W / cw; cw = W; } if (ch > H) { cw *= H / ch; ch = H; }
  if (centro) { cx = centro[0] * W; cy = centro[1] * H; }
  return { x: Math.min(Math.max(0, cx - cw / 2), W - cw), y: Math.min(Math.max(0, cy - ch / 2), H - ch), w: cw, h: ch };
}

/* ---------- filtros para melhorar a foto */
function filtrar(ctx, w, h, f) {
  if (f === 'orig') return;
  const im = ctx.getImageData(0, 0, w, h), d = im.data, n = w * h;
  const niveis = () => { // estica cada canal entre 1% e 99%: corrige foto escura, apagada ou amarelada
    for (let ch = 0; ch < 3; ch++) {
      const hist = new Uint32Array(256); for (let i = ch; i < d.length; i += 4) hist[d[i]]++;
      let a = 0, b = 255, s = 0; while (a < 255 && (s += hist[a]) < n * 0.01) a++; s = 0; while (b > 0 && (s += hist[b]) < n * 0.01) b--;
      if (b - a < 20) continue;
      const lut = new Uint8ClampedArray(256); for (let v = 0; v < 256; v++) lut[v] = (v - a) * 255 / (b - a);
      for (let i = ch; i < d.length; i += 4) d[i] = lut[d[i]];
    }
  };
  if (f === 'auto' || f === 'nitido') niveis();
  if (f === 'claro') { const lut = new Uint8ClampedArray(256); for (let v = 0; v < 256; v++) lut[v] = 255 * Math.pow(v / 255, 0.72) + 6; for (let i = 0; i < d.length; i++) if ((i & 3) !== 3) d[i] = lut[d[i]]; }
  if (f === 'vivas') {
    niveis();
    for (let i = 0; i < d.length; i += 4) {
      const l = 0.3 * d[i] + 0.59 * d[i + 1] + 0.11 * d[i + 2];
      for (let j = 0; j < 3; j++) d[i + j] = l + (d[i + j] - l) * 1.4 + (d[i + j] - 128) * 0.08;
    }
  }
  if (f === 'nitido') {
    const o = new Uint8ClampedArray(d);
    for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
      const i = (y * w + x) * 4;
      for (let j = 0; j < 3; j++) d[i + j] = o[i + j] * 1.8 - (o[i + j - 4] + o[i + j + 4] + o[i + j - w * 4] + o[i + j + w * 4]) * 0.2;
    }
  }
  ctx.putImageData(im, 0, 0);
}

/* ---------- editor: filtro + enquadramento antes de enviar */
const FILTROS_ED = [['orig', 'Original'], ['auto', 'Automático'], ['claro', 'Mais claro'], ['vivas', 'Cores vivas'], ['nitido', 'Mais nítido']];
function abrirEditor(arquivos, ctx) {

function proximoEditor() {

function imgGirada(E) {
  if (!E.giro) return E.img;
  const c = document.createElement('canvas'), q = E.giro % 180 !== 0;
  c.width = q ? E.img.height : E.img.width; c.height = q ? E.img.width : E.img.height;
  const x = c.getContext('2d'); x.translate(c.width / 2, c.height / 2); x.rotate(E.giro * Math.PI / 180); x.drawImage(E.img, -E.img.width / 2, -E.img.height / 2);
  return c;
}
function renderEditor(E, max) {
  const src = E.base, r = regiao(src, E.modo, E.zoom, E.centro);
  const k = Math.min(1, max / Math.max(r.w, r.h));
  const c = document.createElement('canvas'); c.width = Math.round(r.w * k); c.height = Math.round(r.h * k);
  const x = c.getContext('2d'); x.drawImage(src, r.x, r.y, r.w, r.h, 0, 0, c.width, c.height);
  filtrar(x, c.width, c.height, E.filtro);

}
function montarEditor() {

function desenharEditor() {

/* ---------- enquadramento automático das miniaturas (fotos já tiradas) */
const ENQ = { fila: [], ativos: 0, feitos: {} };
function agendarEnquadre(it, id, forcar) {
  if (!id || (!forcar && ENQ.feitos[id])) return;
  ENQ.feitos[id] = true;
  ENQ.fila.push({ it: it, id: id, aba: S.aba });
  setTimeout(rodarEnquadre, 400);
}
function cropQuadrado(img, obj) {
  const W = img.width, H = img.height;
  let s = obj ? Math.max(obj.w, obj.h) * 1.3 : Math.min(W, H);
  s = Math.min(s, W, H);
  const cx = obj ? obj.x + obj.w / 2 : W / 2, cy = obj ? obj.y + obj.h / 2 : H / 2;
  const x = Math.min(Math.max(0, cx - s / 2), W - s), y = Math.min(Math.max(0, cy - s / 2), H - s);
  return [x / W, y / H, s / W, s / H].map(v => Math.round(v * 10000) / 10000);
}
function rodarEnquadre() {
  while (ENQ.ativos < 2 && ENQ.fila.length) {
    const t = ENQ.fila.shift(); ENQ.ativos++;
    api('getDrivePhoto', t.id, 800).then(carregarImg).then(img => {
      let obj = null; try { obj = acharObjeto(img); } catch (e) {}
      const v = t.id + '|' + (obj ? cropQuadrado(img, obj).join(',') : '');
      if (capaInfo(t.it).k && capaInfo(t.it).k !== t.id) return; // Marco escolheu outra enquanto isso
      return api('setCapa', t.aba, t.it.id, v).then(r => { t.it.capa = r; aplicarCrop(t.it, t.id); });
    }).catch(() => {}).then(() => { ENQ.ativos--; rodarEnquadre(); });
  }
}
function aplicarCrop(it, id) {
  const crop = capaInfo(it).k === id ? capaInfo(it).crop : null;
  document.querySelectorAll('#lista [data-id="' + CSS.escape(it.id) + '"] img[data-drive="' + CSS.escape(id) + '"]').forEach(im => {
    if (crop) { const [x, y, sx, sy] = crop; im.className = 'enq'; im.style.cssText = 'width:' + (100 / sx) + '%;height:' + (100 / sy) + '%;left:' + (-x / sx * 100) + '%;top:' + (-y / sy * 100) + '%'; }
    else { im.className = ''; im.style.cssText = ''; }
  });
}

/* ---------- enquadrar a miniatura à mão */

    $('#enqConteudo').innerHTML = '<div class="ed-dica" style="margin:0 0 8px">O quadrado amarelo é o que aparece na miniatura. Toque na foto para mudar o centro.</div>' +
      '<div class="ed-prev" id="enqFoto" style="background:#fff"><img src="' + img.src + '" style="display:block;width:100%" alt="">' +
      '<div id="enqQuadro" style="position:absolute;border:3px solid #FFD200;box-shadow:0 0 0 2000px rgba(0,0,0,.45);pointer-events:none"></div></div>' +
      '<div class="ed-ops" style="margin-top:10px"><button data-enq="mais">Aproximar +</button><button data-enq="menos">Afastar −</button><button data-enq="auto">Automático</button><button data-enq="toda">Foto inteira</button></div>' +
      '<div class="ed-grupo">Como fica</div><div class="tile" id="enqTeste" style="width:140px;aspect-ratio:1;display:block;pointer-events:none"></div>';

}
function desenharEnq() {

  q.style.left = x * 100 + '%'; q.style.top = y * 100 + '%'; q.style.width = sx * 100 + '%'; q.style.height = sy * 100 + '%';

$('#enqConteudo').addEventListener('click', e => {
  const E = S.enq; if (!E || !E.img) return;
  const W = E.img.width, H = E.img.height;
  let [x, y, sx, sy] = E.crop, cx = (x + sx / 2) * W, cy = (y + sy / 2) * H, s = sx * W;

(function () {

  const fim = () => { clearTimeout(tm); tm = null; };
  lista.addEventListener('contextmenu', e => { if (e.target.closest('.tile,.card')) e.preventDefault(); });
  lista.addEventListener('pointerdown', e => {
    const b = e.target.closest('.tile[data-id],.card[data-id]'); if (!b) return;
    alvo = b; x0 = e.clientX; y0 = e.clientY; fim(); S.peekFez = false;
    tm = setTimeout(() => { tm = null; mostrarPeek(alvo.dataset.id); S.peekFez = true; if (navigator.vibrate) try { navigator.vibrate(15); } catch (er) {} }, 450);
  });
  lista.addEventListener('pointermove', e => { if (tm && Math.abs(e.clientX - x0) + Math.abs(e.clientY - y0) > 12) fim(); });
  const solta = () => { fim(); if (pk.classList.contains('on')) setTimeout(() => { pk.classList.remove('on'); setTimeout(() => { S.peekFez = false; }, 350); }, 60); };
  ['pointerup', 'pointercancel'].forEach(t => window.addEventListener(t, solta));
  pk.addEventListener('click', () => pk.classList.remove('on'));

      setPrev('proced', frequencias(irm, 'proced')[0]);

    }

function salvar() {
  const form = $('#form'), obj = {};
  const manuais = new Set(S.editando ? String(S.editando.manuais || '').split(';').filter(Boolean) : []);
  Array.prototype.forEach.call(form.elements, el => {
    if (!el.name) return;
    obj[el.name] = el.value.trim();
    if (el.classList.contains('alterado')) manuais.add(el.name);
    else if (el.classList.contains('previsto')) manuais.delete(el.name);
  });
  obj.manuais = Array.from(manuais).join(';');
  if (!obj.nome) { toast('Informe o nome do modelo.', true); campo('nome').focus(); return; }
  if (!obj.mack && !obj.mack2) { toast('Informe o código Mack.', true); campo('mack').focus(); return; }
  const editando = S.editando;
  if (editando) obj.id = editando.id;
  const btns = document.querySelectorAll('#form button[type=submit], #fSalvarTopo');
  btns.forEach(b => b.disabled = true);
  toast('Gravando na planilha…');
  api('saveItem', S.aba, obj).then(salvo => {
    const lista = S.items[S.aba], novo = prep(salvo);
    if (editando) {
      const i = lista.findIndex(x => x.id === salvo.id); lista[i] = novo; delete S.refCache[salvo.id];
    } else {
      let pos = -1; lista.forEach((x, i) => { if (String(x.num) === String(novo.num)) pos = i; });
      if (pos < 0) { lista.forEach((x, i) => { if (Number(x.num) < Number(novo.num)) pos = i; }); }
      lista.splice(pos < 0 ? lista.length : pos + 1, 0, novo);
      $('#qtd' + S.aba).textContent = '(' + lista.length + ')';
    }
    S.nomesCache = {};
    toast(editando ? 'Alterações salvas' : 'Miniatura cadastrada · ' + salvo.id);
    fechar('#pForm'); renderLista(); abrirDetalhe(salvo.id);
    const pend = S.fotoPendente; S.fotoPendente = null;
    if (pend && !editando) api('uploadPhoto', S.aba, salvo.id, pend).then(l => { novo.fotos = l; if (S.atual === novo) renderDetalhe(); renderLista(); toast('Foto da busca guardada nesta miniatura'); })
      .catch(err => toast('A foto não foi guardada: ' + err.message, true));
  }).catch(err => toast('Não salvou: ' + err.message, true)).finally(() => btns.forEach(b => b.disabled = false));
}

  if (a === 'enquadrar') abrirEnquadre(it, t.dataset.foto);

  }
  if (a === 'removerFoto') confirmar('Remover esta foto da coleção? Ela vai para a lixeira do Drive.').then(ok => {

    api('removePhoto', S.aba, it.id, t.dataset.foto).then(l => { it.fotos = l; S.selFoto = 0; renderDetalhe(); renderLista(); }).catch(err => toast(err.message, true));

  if (a === 'duplicar') {
    const base = {};
    PREVER.concat(['mack', 'mack2']).forEach(k => base[k] = it[k]);
    fechar('#pDetalhe'); abrirForm(base, false);

});

    '<div class="acoes"><button class="btn prim" data-s="copiar">Fazer uma cópia agora</button></div></div>';

  const v = s.integridade, ab = v.abas;
  h += '<div class="secao"><h3>Conferência dos dados</h3><dl class="campos">' + Object.keys(ab).map(n =>

      (s.semanal.ok ? 'tudo certo' : s.semanal.repetidos + ' ID(s) repetido(s) para revisar') + (s.semanal.corrigidos ? ' · ' + s.semanal.corrigidos + ' linha(s) recebeu(ram) ID' : '') +
      (s.semanal.copiaRefeita ? ' · a cópia estava atrasada e foi refeita' : '') + '.</div>' : '') + '</div>';

function buscarPorFoto(f) {
  const rodada = (S.fbRodada = (S.fbRodada || 0) + 1);
  reduzirImagem(f, 1600, S.centralizar).then(d => {
    S.fotoBusca = d;
    $('#fbConteudo').innerHTML = '<img class="fb-foto" src="' + d + '" alt=""><div class="carregando" style="margin-top:10px">Analisando a foto… (alguns segundos)</div>';
    abrir('#pFotoBusca');
    let mostrouCor = false;
    // se o Google demorar, mostra logo a busca pela cor; o resultado do Google entra quando chegar
    const tm = setTimeout(() => { if (S.fbRodada === rodada) { mostrouCor = true; buscaPorCor({ motivo: 'demora' }); } }, 20000);
    return reduzirImagem(f, 1024, S.centralizar).then(p => apiJ('reconhecerImagem', p)).catch(err => ({ ok: false, motivo: 'erro', mensagem: err.message })).then(res => {
      clearTimeout(tm);
      if (S.fbRodada !== rodada || !$('#pFotoBusca').classList.contains('aberto')) return;
      if (res.ok || !mostrouCor) renderFotoBusca(res);
      else { const a = $('#fbAvisoCor'); if (a) a.innerHTML = 'O reconhecimento do modelo pelo Google não respondeu agora (' + esc(res.mensagem || 'erro') + '). Use a busca pela <b>cor</b> abaixo.'; }
    });
  }).catch(err => { $('#fbConteudo').insertAdjacentHTML('beforeend', '<div class="aviso dup">Não foi possível abrir a foto: ' + esc(err.message) + '</div>'); });
}

function noColecao(c) {
  const nomeT = norm(c.nome).split(/[^a-z0-9]+/).filter(w => w.length > 2);
  const corT = norm((c.cor_pt || '') + ' ' + (c.cor_en || '')).split(/\s+/).filter(w => w.length > 2);
  const out = [];

    linha('Cor', it.cor), linha('Rodas', it.roda), linha('Base', it.base), linha('Interior', it.interior), linha('Vidro', it.vidro),
    linha('Outros detalhes', it.outros), linha('Adesivo', it.adesivo), linha('Ano', it.ano), linha('Conservação', it.cons), linha('Caixa', it.caixa),
    !fotosMarco(it).length && r.id ? 'Foto de referência: ' + bancoUrl(r.id, 800) : '', '', 'Coleção Marco Geus'].filter((x, i, a) => x !== '' || i === a.length - 2).join('\n');
  const fm = fotosMarco(it);
  if (!fm.length) { compartilharTexto(txt, null); return; }
  toast('Preparando a foto…');
  api('getDrivePhoto', fm[0], 1200).then(d => fetch(d)).then(res => res.blob())
    .then(b => compartilharTexto(txt, new File([b], 'matchbox-' + codeNorm(it.mack2 || it.mack) + '.jpg', { type: b.type || 'image/jpeg' })))
    .catch(() => compartilharTexto(txt, null));
}

/* ================================================================ comparar fotos */
function abrirComparar(it) {
  const fotos = listaFotos(it);
  const iA = Math.max(0, fotos.findIndex(f => f.tipo === 'marco'));
  let iB = fotos.findIndex((f, i) => i !== iA && f.tipo === 'ref' && f.melhor);
  if (iB < 0) iB = fotos.findIndex((f, i) => i !== iA);
  S.cmp = { it: it, fotos: fotos, a: iA, b: Math.max(iB, 0) };
  $('#cTitulo').textContent = 'Comparar · ' + (S.aba === 'Lesney' ? (it.mack2 || it.mack) : it.mack);
  renderComparar(); abrir('#pComparar');
}
function renderComparar() {
  const c = S.cmp, it = c.it, fotos = c.fotos;
  const lado = (k, rot) => {
    const f = fotos[c[k]];
    const extra = f.tipo === 'marco' ? 'data-drive="' + esc(f.id) + '"' : (f.orig && f.orig !== f.src ? 'data-orig="' + esc(f.orig) + '"' : '');
    return '<div class="cmp-lado"><div class="rot"><button data-cmp="' + k + '" data-d="-1" aria-label="Anterior">&lsaquo;</button><span>' + rot + ' · ' +
      (f.tipo === 'marco' ? 'foto do Marco' : 'referência') + ' (' + (c[k] + 1) + '/' + fotos.length + ')</span><button data-cmp="' + k + '" data-d="1" aria-label="Próxima">&rsaquo;</button></div>' +
      '<div class="img">' + imgTag(f.src, extra) + '</div>' +
      (f.tipo === 'ref' ? '<div class="leg">' + marcar(f.legenda || '', f.marcadas) + (f.fonte ? '<br>Fonte: ' + esc(f.fonte) : '') + '</div>' : '') + '</div>';
  };
  let h = '<div class="cmp">' + lado('a', 'A') + lado('b', 'B') + '</div>';
  const ref = S.refCache[it.id], pc = cm(it), vm = ref && ref.variacoes && pc && ref.variacoes.find(v => v.v === pc.v);
  if (vm) h += '<div class="aviso info" style="margin-top:12px"><b>Variação ' + esc(cmTxt(it)) + ' segundo Charlie Mack:</b> ' + esc(vm.desc) + (traduzir(vm.desc) ? '<br><small>' + esc(traduzir(vm.desc)) + '</small>' : '') + '</div>';
  const dist = distintivos(it), dk = Object.keys(dist);
  if (dk.length) h += '<div class="destaques"><h3>Confira nas fotos</h3>' + dk.map(k => '<span class="dchip"><b>' + esc(label(k)) + ':</b>' + esc(it[k] || '(vazio)') +
    '<i>nas outras variações: ' + esc(dist[k].join(' / ')) + '</i></span>').join('') + '</div>';
  h += '<div class="foto-credito">As palavras destacadas na legenda são as que batem com a descrição deste exemplar.</div>';
  $('#cConteudo').innerHTML = h;
}
$('#cConteudo').addEventListener('click', e => {
  const b = e.target.closest('[data-cmp]'); if (!b) return;
  const c = S.cmp, n = c.fotos.length, k = b.dataset.cmp, outro = k === 'a' ? 'b' : 'a';
  let v = (c[k] + (+b.dataset.d) + n) % n; if (v === c[outro] && n > 2) v = (v + (+b.dataset.d) + n) % n;
  c[k] = v; renderComparar();
});

/* ================================================================ início */
document.querySelectorAll('.logo-mini,.avatar').forEach(el => { el.innerHTML = logoSvg(); });
document.body.classList.toggle('realce', S.realce);
$('.avatar').addEventListener('click', () => { S.filtro = null; S.q = ''; $('#q').value = ''; renderLista(); });
renderFiltros(); ajustarTopo();
const demora = setTimeout(() => erroSplash('Está demorando mais que o normal. Se continuar assim, abra a URL do app com ?diag=1 no final.'), 30000);
carregar().then(() => {
  clearTimeout(demora); renderLista(); $('#splash').style.display = 'none'; ajustarTopo();
  apiJ('getSeguranca').then(atualizarStatusSeg).catch(() => {});
  setTimeout(() => carregarProcura().catch(() => {}), 2500);
})
  .catch(err => { clearTimeout(demora); erroSplash('Erro ao abrir: ' + err.message); });

window.__matchbox = S; // útil para diagnóstico no console
window.__mbFoto = { acharObjeto: acharObjeto, corDominante: corDominante, carregarImg: carregarImg, filtrar: filtrar };
})();
